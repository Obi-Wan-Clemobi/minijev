[project]
name = "minijev"
version = "0.1.0"
description = "Typed, calibrated decisions read out of one forward pass of a small open model"
readme = "README.md"
requires-python = "==3.12.*"
# The same pins as poc/: torch 2.2.2 is the last build for Intel Macs (PLAN.md asks for torch>=2.4, which does not
# exist for this platform).
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "transformers==4.49.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
minijev = "minijev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minijev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

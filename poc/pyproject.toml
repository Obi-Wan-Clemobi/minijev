[project]
name = "minijev-poc"
version = "0.0.1"
description = "minijev proof of concept: Jev-shaped typed decisions read from label-token probabilities"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.2.2",            # last x86_64 macOS wheels
    "numpy<2",                 # torch 2.2.2 was built against numpy 1.x
    "transformers==4.49.0",    # resolves with torch 2.2.2; Qwen2.5 support
    "minijev",                 # the package in ../src/minijev (editable)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
train = [
    "peft>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: loads a Qwen model: most tests use 0.5B (~1 GB), the template tests use the app's model from minijev.env (1.5B, ~3 GB)"]

# In Docker (Linux), use the CPU-only torch build: the default Linux wheel pulls ~2 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
minijev = { path = "..", editable = true }
